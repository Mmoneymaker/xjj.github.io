<!DOCTYPE html>
<html>
  <head>
      <meta charset="UTF-8">   <!-- 加上这行就行了！ -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
      <title>Spring Boot WebSocket Chat Application | CalliCoder</title>
      <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <noscript>
      <h2>Sorry! Your browser doesn't support Javascript</h2>
    </noscript>

    <div id="username-page">
        <div class="username-page-container">
            <h1 class="title">Type your username</h1>
            <form id="usernameForm" name="usernameForm">
                <div class="form-group">
                    <input type="text" id="name" placeholder="Username" autocomplete="off" class="form-control" />
                </div>
                <div class="form-group">
                    <input type="text" id="password" placeholder="Password" autocomplete="off" class="form-control"/>
                </div>

                <div class="form-group">
                    <button type="submit" id="submission" class="hidden accent username-submit">Start Chatting</button>
                </div>
                <div class="form-group">
                    <button id="rbutton" type="button" class="accent username-submit">  Register </button>
                </div>
                <div class="form-group">
                    <button id="login" type="button" class="accent username-submit">  login </button>
                </div>
                <div class="form-group">
                    <button id="testToken" type="button" class="accent username-submit">  testToekn </button>
                </div>
            </form>
        </div>
    </div>


    <!-- 聊天主页面 -->
    <div id="chat-page" class="hidden">
        <div style="display:flex; height:100%;">
            <!-- 左侧：聊天列表 -->
            <div id="userListContainer" style="width:260px; background:#f8f9fa; border-right:1px solid #ddd; display:flex; flex-direction:column;">
                <div style="padding:15px; background:#128ff2; color:white; display:flex; justify-content:space-between; align-items:center;">
                    <h3 id="onlineUsersTitle" style="margin:0;">聊天</h3>
                    <button id="createGroupBtn" style="padding:5px 10px; font-size:12px; background:white; color:#128ff2; border:none; border-radius:4px; cursor:pointer;">创建群聊</button>
                </div>

                <!-- 聊天选项卡 -->
                <div style="display:flex; background:white; border-bottom:1px solid #ddd;">
                    <button id="privateChatTab" class="tab-btn active" style="flex:1; padding:10px; border:none; background:white; cursor:pointer; border-bottom:2px solid #128ff2; color:#128ff2;">私聊</button>
                    <button id="groupChatTab" class="tab-btn" style="flex:1; padding:10px; border:none; background:white; cursor:pointer;">群聊</button>
                </div>

                <!-- 私聊列表 -->
                <div id="privateChatList" style="flex:1; overflow-y:auto; display:block;">
                    <ul id="userList" style="list-style:none; padding:0; margin:0;"></ul>
                </div>

                <!-- 群聊列表 -->
                <div id="groupChatList" style="flex:1; overflow-y:auto; display:none;">
                    <ul id="groupList" style="list-style:none; padding:0; margin:0;"></ul>
                </div>
            </div>

            <!-- 右侧：聊天窗口 -->
            <div id="chatContainer" style="flex:1; display:flex; flex-direction:column; min-height:0;">
                <div class="chat-header" style="display:flex; justify-content:space-between; align-items:center;">
                    <h2 id="chatTitle">选择一个用户开始聊天</h2>
                    <div id="chatActions" style="display:none;">
                        <button id="groupInfoBtn" style="padding:5px 10px; font-size:12px; background:#007bff; color:white; border:none; border-radius:4px; cursor:pointer; display:none;">群信息</button>
                    </div>
                </div>
                <div class="connecting" id="connectingStatus">连接中...</div>
                <ul id="messageArea" style="flex:1; overflow-y:auto; padding:0 20px; margin:0; list-style:none;"></ul>
                <form id="messageForm" style="padding:20px; background:#fff; border-top:1px solid #eee;">
                    <div class="input-group">
                        <input type="text" id="message" placeholder="输入消息..." autocomplete="off" class="form-control" style="flex:1;"/>
                        <button type="submit" class="primary" style="margin-left:10px;">发送</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

<!--    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.1.4/sockjs.min.js"></script>-->
<!--    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>-->
    <!--不要了 <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@5.0.0/bundles/stomp.umd.js"></script>-->
    <!-- 1. 必须引入 SockJS 库 -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <!-- 2. 引入 StompJS 库 -->
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

<!--    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>-->
<!--    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@5.0.0/bundles/stomp.umd.min.js"></script>-->
<!--    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@5.0.0/bundles/stomp.umd.js"></script>-->
    <!-- 创建群聊模态框 -->
    <div id="createGroupModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000;">
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border-radius:8px; min-width:400px; max-width:600px;">
            <h3 style="margin-top:0;">创建群聊</h3>
            <form id="createGroupForm">
                <div style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px;">群聊名称：</label>
                    <input type="text" id="groupName" required style="width:100%; padding:8px; border:1px solid #ddd; border-radius:4px;">
                </div>
                <div style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px;">群聊描述：</label>
                    <textarea id="groupDesc" rows="3" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:4px; resize:vertical;"></textarea>
                </div>
                <div style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px;">选择成员：</label>
                    <div id="memberSelectList" style="max-height:200px; overflow-y:auto; border:1px solid #ddd; padding:10px;">
                        <!-- 动态加载用户列表 -->
                    </div>
                </div>
                <div style="text-align:right; margin-top:20px;">
                    <button type="button" id="cancelCreateGroup" style="margin-right:10px; padding:8px 20px; border:1px solid #ddd; background:white; border-radius:4px; cursor:pointer;">取消</button>
                    <button type="submit" style="padding:8px 20px; background:#128ff2; color:white; border:none; border-radius:4px; cursor:pointer;">创建</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 群信息模态框 -->
    <div id="groupInfoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000;">
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border-radius:8px; min-width:400px; max-width:600px; max-height:80vh; overflow-y:auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3 style="margin:0;">群信息</h3>
                <button id="closeGroupInfo" style="background:none; border:none; font-size:20px; cursor:pointer;">&times;</button>
            </div>
            <div id="groupInfoContent">
                <!-- 动态加载群信息 -->
            </div>
        </div>
    </div>

    <script charset=UTF-8 src="/js/main.js"></script>
  </body>
</html>
